[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tabular-foundation-research"
version = "0.1.0"
description = "Reproducible tabular ICL priors, training, inference and evaluation"
requires-python = ">=3.9"
dependencies = ["numpy>=1.26,<3", "torch>=2.6,<3", "importlib-metadata>=6; python_version < '3.10'"]

[project.optional-dependencies]
reference = ["scipy>=1.12,<2", "scikit-learn>=1.5,<2", "psutil>=5,<8", "threadpoolctl>=3,<4", "xgboost>=2.1,<4"]
test = ["pytest>=8,<10", "scipy>=1.12,<2", "scikit-learn>=1.5,<2"]
trees = ["pandas>=2,<3", "scikit-learn>=1.5,<2", "xgboost>=2.1,<4", "lightgbm>=4.5,<5", "catboost>=1.2,<2"]

[project.scripts]
tfm-train = "tabular_foundation.train:main"
tfm-predict = "tabular_foundation.predict:main"
tfm-evaluate = "tabular_foundation.evaluate:main"
tfm-profile = "tabular_foundation.profile:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
